<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Alex+Brush&amp;display=swap");
    </style>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A2D15"/>
      <stop offset="55%" style="stop-color:#243D1D"/>
      <stop offset="100%" style="stop-color:#1A2D15"/>
    </linearGradient>
    <radialGradient id="orbGrad" cx="42%" cy="35%" r="58%">
      <stop offset="0%" style="stop-color:#DEE2B0"/>
      <stop offset="45%" style="stop-color:#B4B56D"/>
      <stop offset="100%" style="stop-color:#6B8F71"/>
    </radialGradient>
    <radialGradient id="shimmer" cx="35%" cy="28%" r="38%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.38"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="bloom" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#B4B56D;stop-opacity:0.22"/>
      <stop offset="100%" style="stop-color:#B4B56D;stop-opacity:0"/>
    </radialGradient>
    <linearGradient id="tGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A8B6E;stop-opacity:0"/>
      <stop offset="45%" style="stop-color:#4A8B6E;stop-opacity:0.75"/>
      <stop offset="100%" style="stop-color:#4A8B6E;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="tOlive" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#B4B56D;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#B4B56D;stop-opacity:0.65"/>
      <stop offset="100%" style="stop-color:#B4B56D;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="tTeal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8DB2A2;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#8DB2A2;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#8DB2A2;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="tCoral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E4704B;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#E4704B;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#E4704B;stop-opacity:0"/>
    </linearGradient>
    <radialGradient id="coralGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#E4704B;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#E4704B;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="oliveGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#DEE2B0;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#B4B56D;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="tealGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#8DB2A2;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#8DB2A2;stop-opacity:0"/>
    </radialGradient>
    <filter id="orbShadow">
      <feDropShadow dx="0" dy="14" stdDeviation="36" flood-color="#0d1a0b" flood-opacity="0.55"/>
    </filter>
    <filter id="softBlur"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="nodeBlur"><feGaussianBlur stdDeviation="5"/></filter>
    <clipPath id="roundedClip">
      <rect width="1024" height="1024" rx="225" ry="225"/>
    </clipPath>
  </defs>

  <g clip-path="url(#roundedClip)">
    <rect width="1024" height="1024" fill="url(#bgGrad)"/>
    <pattern id="dotGrid" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="1" fill="#3A5C30" opacity="0.35"/>
    </pattern>
    <rect width="1024" height="1024" fill="url(#dotGrid)"/>
    <ellipse cx="512" cy="440" rx="480" ry="440" fill="url(#bloom)" filter="url(#softBlur)"/>

    <!-- Memory threads -->
    <path d="M 130 180 Q 380 80 620 320 Q 760 460 860 760" fill="none" stroke="url(#tTeal)" stroke-width="2" opacity="0.8"/>
    <path d="M 880 140 Q 560 270 460 475 Q 360 680 150 890" fill="none" stroke="url(#tOlive)" stroke-width="1.8" opacity="0.7"/>
    <path d="M 100 580 Q 320 370 512 425 Q 700 480 900 265" fill="none" stroke="url(#tGreen)" stroke-width="1.5" opacity="0.65"/>
    <path d="M 220 860 Q 480 625 780 545 Q 920 510 960 255" fill="none" stroke="url(#tCoral)" stroke-width="1.2" opacity="0.5"/>
    <path d="M 60 405 Q 280 215 580 308 Q 780 390 940 605" fill="none" stroke="url(#tTeal)" stroke-width="1" opacity="0.4"/>

    <!-- Memory nodes -->
    <circle cx="295" cy="148" r="18" fill="url(#coralGlow)" filter="url(#nodeBlur)" opacity="0.7"/>
    <circle cx="295" cy="148" r="6.5" fill="#E4704B" opacity="0.98"/>
    <circle cx="295" cy="148" r="3" fill="#F0896A"/>
    <circle cx="840" cy="210" r="14" fill="url(#coralGlow)" filter="url(#nodeBlur)" opacity="0.55"/>
    <circle cx="840" cy="210" r="5" fill="#E4704B" opacity="0.9"/>
    <circle cx="730" cy="345" r="15" fill="url(#oliveGlow)" filter="url(#nodeBlur)" opacity="0.6"/>
    <circle cx="730" cy="345" r="5.5" fill="#DEE2B0" opacity="0.95"/>
    <circle cx="185" cy="745" r="12" fill="url(#oliveGlow)" filter="url(#nodeBlur)" opacity="0.5"/>
    <circle cx="185" cy="745" r="4.5" fill="#B4B56D" opacity="0.9"/>
    <circle cx="880" cy="645" r="13" fill="url(#tealGlow)" filter="url(#nodeBlur)" opacity="0.55"/>
    <circle cx="880" cy="645" r="5" fill="#8DB2A2" opacity="0.9"/>
    <circle cx="148" cy="490" r="10" fill="url(#tealGlow)" filter="url(#nodeBlur)" opacity="0.45"/>
    <circle cx="148" cy="490" r="3.5" fill="#8DB2A2" opacity="0.85"/>
    <circle cx="460" cy="185" r="5" fill="#B4B56D" opacity="0.55"/>
    <circle cx="690" cy="815" r="5" fill="#8DB2A2" opacity="0.45"/>
    <circle cx="340" cy="858" r="4" fill="#DEE2B0" opacity="0.35"/>

    <!-- Orb -->
    <circle cx="512" cy="430" r="205" fill="#0d1a0b" opacity="0.3" filter="url(#softBlur)"/>
    <circle cx="512" cy="430" r="195" fill="url(#orbGrad)" filter="url(#orbShadow)"/>
    <circle cx="512" cy="430" r="195" fill="url(#shimmer)"/>
    <circle cx="512" cy="430" r="195" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.15"/>

    <!-- E lettermark in Alex Brush matching wordmark -->
    <text
      x="512"
      y="448"
      font-family="'Alex Brush', Georgia, serif"
      font-size="220"
      font-weight="400"
      fill="#1A2D15"
      opacity="0.88"
      text-anchor="middle"
      dominant-baseline="middle">E</text>

    <!-- Coral accent dot -->
    <circle cx="610" cy="555" r="14" fill="#E4704B" opacity="0.18" filter="url(#nodeBlur)"/>
    <circle cx="610" cy="555" r="10" fill="#E4704B" opacity="0.95"/>
    <circle cx="610" cy="555" r="5" fill="#F0896A"/>

    <!-- Separator line -->
    <line x1="330" y1="692" x2="694" y2="692" stroke="#DEE2B0" stroke-width="0.8" opacity="0.22"/>

    <!-- "emori" wordmark in Alex Brush via font-family -->
    <!-- Font is loaded via @import in the style block above -->
    <text
      x="512"
      y="758"
      font-family="'Alex Brush', Georgia, serif"
      font-size="88"
      font-weight="400"
      fill="#DEE2B0"
      opacity="0.90"
      text-anchor="middle"
      dominant-baseline="middle"
      letter-spacing="4">Emori</text>

    <ellipse cx="512" cy="920" rx="280" ry="36" fill="#3A5C30" opacity="0.35" filter="url(#softBlur)"/>
  </g>
</svg>