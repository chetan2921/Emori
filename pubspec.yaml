name: emori
description: "Emori — Your AI-powered second brain."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # API calls
  http: ^1.2.0

  # Local database
  sqflite: ^2.3.3+1
  path_provider: ^2.1.3
  path: ^1.9.0

  # State management
  flutter_riverpod: ^2.5.1

  # Environment variables
  flutter_dotenv: ^5.1.0

  # UUID for entry IDs
  uuid: ^4.4.0

  # Typography
  # google_fonts: ^6.2.1 (removed)

  # Animations
  flutter_animate: ^4.5.2

  # Speech to text
  speech_to_text: ^7.0.0

  # Image support
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  flutter_svg: ^2.0.10

  # Encryption
  encrypt: ^5.0.3
  flutter_local_notifications: ^21.0.0-dev.1
  timezone: ^0.11.0
  fl_chart: ^1.1.1
  flutter_tts: ^4.2.5
  intl: ^0.19.0
  permission_handler: ^12.0.1
  url_launcher: ^6.2.5

  # Auth & Backend
  supabase_flutter: ^2.8.4
  google_sign_in: ^6.2.1
  shared_preferences: ^2.2.3

  # Onboarding
  smooth_page_indicator: ^1.2.0+3
  flutter_timezone: ^5.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/emori_icon2.svg.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/icons/
  fonts:
    - family: AlexBrush
      fonts:
        - asset: assets/fonts/Alex_Brush/AlexBrush-Regular.ttf
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/Plus_Jakarta_Sans/static/PlusJakartaSans-Regular.ttf
        - asset: assets/fonts/Plus_Jakarta_Sans/static/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/Plus_Jakarta_Sans/static/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Plus_Jakarta_Sans/static/PlusJakartaSans-Bold.ttf
          weight: 700
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito/static/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito/static/Nunito-Medium.ttf
          weight: 500
        - asset: assets/fonts/Nunito/static/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito/static/Nunito-Bold.ttf
          weight: 700
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/Playfair_Display/static/PlayfairDisplay-Regular.ttf
        - asset: assets/fonts/Playfair_Display/static/PlayfairDisplay-Italic.ttf
          style: italic
        - asset: assets/fonts/Playfair_Display/static/PlayfairDisplay-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Playfair_Display/static/PlayfairDisplay-Bold.ttf
          weight: 700
